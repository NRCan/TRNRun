name: Client contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_matlab:
        description: Run licensed MATLAB R2022b tests
        type: boolean
        default: false

jobs:
  python-contract:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: libraries/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv run pytest tests/test_contract.py -q

  native:
    runs-on: windows-latest
    strategy:
      matrix:
        component: [trnrun, trnrunq]
    defaults:
      run:
        working-directory: components/${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"
      - run: nimble test -y

  release-artifacts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025a
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.14.1"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - shell: powershell
        run: |
          Push-Location components/trnrun
          nimble bin -y
          Pop-Location
          Push-Location components/trnrunq
          nimble bin -y
          Pop-Location
          uv build --wheel --out-dir dist libraries/python
          New-Item libraries/matlab/toolbox/bin -ItemType Directory -Force | Out-Null
          Copy-Item components/trnrun/build/trnrun.exe libraries/matlab/toolbox/bin -Force
          Copy-Item components/trnrunq/build/trnrunq.exe libraries/matlab/toolbox/bin -Force
          Copy-Item LICENSE libraries/matlab/toolbox/LICENSE -Force
          Copy-Item libraries/matlab/README.md libraries/matlab/toolbox/README.md -Force
      - uses: matlab-actions/run-command@v2
        with:
          command: cd('libraries/matlab'); buildtool package
      - uses: actions/upload-artifact@v4
        with:
          name: client-packages
          path: |
            dist/*
            libraries/matlab/dist/TRNRun.mltbx

  matlab-contract:
    if: github.event_name == 'workflow_dispatch' && inputs.run_matlab
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2022b
      - shell: powershell
        run: |
          ./libraries/matlab/tests/transport/buildFakeQueue.ps1
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath('libraries/matlab/tests'); runUnitTests; runTransportTests
