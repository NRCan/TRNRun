name: Client contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_matlab:
        description: Run licensed MATLAB R2022b tests
        type: boolean
        default: false

jobs:
  python-contract:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: libraries/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv run pytest tests/test_contract.py -q

  native:
    runs-on: windows-latest
    strategy:
      matrix:
        component: [trnrun, trnrunq]
    defaults:
      run:
        working-directory: components/${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"
      - run: nimble test -y

  release-artifacts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.14.1"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - shell: powershell
        run: |
          Push-Location components/trnrun
          nimble bin -y
          Pop-Location
          Push-Location components/trnrunq
          nimble bin -y
          Pop-Location
          ./libraries/matlab/interop/build.ps1
          ./libraries/matlab/stage-native.ps1
          uv build --wheel --out-dir dist libraries/python
          ./libraries/matlab/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: client-packages
          path: dist/*

  matlab-contract:
    if: github.event_name == 'workflow_dispatch' && inputs.run_matlab
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2022b
      - shell: powershell
        run: |
          ./libraries/matlab/interop/build.ps1
          ./libraries/matlab/tests/transport/buildFakeQueue.ps1
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath('libraries/matlab/tests'); runUnitTests; runTransportTests
