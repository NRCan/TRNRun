name: Build Windows distributions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test TRNRun clients
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: libraries/python/uv.lock

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Report tool versions
        run: |
          python --version
          uv --version
          nim --version
          nimble --version
          zig version
          just --version

      - name: Build and test native and Python clients
        run: just clients-ci-prepare

      - name: Test MATLAB toolbox
        uses: matlab-actions/run-build@v3
        with:
          tasks: test
          startup-options: -sd libraries/matlab

      - name: Build MATLAB toolbox
        uses: matlab-actions/run-build@v3
        with:
          tasks: clean package
          startup-options: -sd libraries/matlab

      - name: Assemble client distributions
        run: just clients-ci-assemble

      - name: Upload Windows distributions
        uses: actions/upload-artifact@v7
        with:
          name: trnrun-windows-distributions
          path: |
            dist/*.whl
            dist/*.mltbx
            dist/*.zip
          if-no-files-found: error
