name: Build Windows distributions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test TRNRun clients
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: libraries/python/uv.lock

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.14.1"

      - name: Set up just
        uses: extractions/setup-just@v3

      - name: Report tool versions
        run: |
          python --version
          uv --version
          nim --version
          nimble --version
          zig version
          just --version

      - name: Build, test, and package clients
        run: just clients-ci

      - name: Upload Windows distributions
        uses: actions/upload-artifact@v4
        with:
          name: trnrun-windows-distributions
          path: |
            dist/*.whl
            dist/*.mltbx
            dist/*.zip
          if-no-files-found: error
